# Fly.io deployment for TaskHub API.
#
#   fly launch --no-deploy --name <your-app> --region iad
#   fly postgres create --name taskhub-db
#   fly postgres attach taskhub-db --app <your-app>
#   fly secrets set TASKHUB_JWT_SECRET="$(openssl rand -base64 48)" \
#                   TASKHUB_DB_URL="jdbc:postgresql://<host>:5432/<db>?sslmode=require" \
#                   TASKHUB_DB_USER="<user>" TASKHUB_DB_PASSWORD="<password>" \
#                   TASKHUB_CORS_ORIGINS="https://<your-web-origin>"
#   fly deploy
#
# `fly postgres attach` also injects DATABASE_URL (postgres://...), which Spring cannot use
# directly — the explicit TASKHUB_DB_* secrets above are what the app reads.

# Reused pre-existing app in org "personal" (slug ticyb) — this org cannot create new apps
# or a Fly Postgres cluster, and Fly stops unmanaged sidecar machines, so PostgreSQL runs
# inside the API Machine as a supervised process (see backend/Dockerfile.fly) with its data
# on the "pgdata" volume, reachable only over loopback.
#
# For a normal deployment with a managed database use backend/Dockerfile + TASKHUB_DB_URL.
app = "crud-app-metbxg"
primary_region = "iad"

[build]
  dockerfile = "backend/Dockerfile.fly"

# The database volume. Attached to the single app Machine created by `fly deploy`.
[[mounts]]
  source = "pgdata"
  destination = "/data"

[env]
  SPRING_PROFILES_ACTIVE = "prod"
  POSTGRES_DB = "taskhub"
  POSTGRES_USER = "taskhub"
  TASKHUB_DB_URL = "jdbc:postgresql://127.0.0.1:5432/taskhub"
  TASKHUB_DB_USER = "taskhub"
  PORT = "8080"
  TASKHUB_LOG_LEVEL = "INFO"
  TASKHUB_HEALTH_DETAILS = "never"
  TASKHUB_DB_POOL_SIZE = "10"
  # Set TASKHUB_OPENAPI_ENABLED=false to hide Swagger UI in production.
  TASKHUB_OPENAPI_ENABLED = "true"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

[[http_service.checks]]
  interval = "15s"
  timeout = "3s"
  grace_period = "30s"
  method = "GET"
  path = "/actuator/health/liveness"

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "45s"
  method = "GET"
  path = "/actuator/health/readiness"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  # Postgres + JVM share this Machine; 1 GB is the practical minimum.
  memory = "1024mb"

# Schema migrations run on application start (Flyway takes a database lock, so a rolling
# deploy cannot apply the same migration twice). Fly's health checks gate traffic until
# /actuator/health/readiness reports UP.
