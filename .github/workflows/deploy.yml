name: Deploy

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      target:
        description: 'Deployment target'
        required: true
        default: fly
        type: choice
        options: [fly, render]

permissions:
  contents: read

jobs:
  deploy-fly:
    name: Deploy to Fly.io
    if: ${{ (github.event_name == 'push' || inputs.target == 'fly') }}
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_APP: ${{ vars.FLY_APP_NAME }}
      PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Skip when Fly is not configured
        if: env.FLY_API_TOKEN == ''
        run: |
          echo "FLY_API_TOKEN secret is not set — skipping Fly deployment."
          exit 0

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        if: env.FLY_API_TOKEN != ''
        run: flyctl deploy --remote-only --app "$FLY_APP" --wait-timeout 300

      - name: Smoke test the deployment
        if: env.FLY_API_TOKEN != '' && env.PUBLIC_API_URL != ''
        run: |
          chmod +x scripts/smoke-test.sh
          for attempt in $(seq 1 10); do
            if BASE_URL="$PUBLIC_API_URL" EMAIL="${{ secrets.SMOKE_EMAIL }}" \
                 PASSWORD="${{ secrets.SMOKE_PASSWORD }}" ./scripts/smoke-test.sh; then
              exit 0
            fi
            echo "Attempt $attempt failed, retrying in 15s..."
            sleep 15
          done
          echo "Smoke test failed after 10 attempts"; exit 1

  deploy-render:
    name: Deploy to Render
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.target == 'render' }}
    runs-on: ubuntu-latest
    env:
      RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
    steps:
      - name: Trigger Render deploy
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK_URL secret is not set — skipping."; exit 0
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK"

  verify-public-api:
    name: Verify public API
    runs-on: ubuntu-latest
    needs: [deploy-fly]
    if: always() && vars.PUBLIC_API_URL != ''
    steps:
      - uses: actions/checkout@v4
      - name: Health check
        run: |
          curl -fsS "${{ vars.PUBLIC_API_URL }}/actuator/health" | tee /tmp/health.json
          grep -q '"status":"UP"' /tmp/health.json
      - name: OpenAPI document is served
        run: curl -fsS "${{ vars.PUBLIC_API_URL }}/v3/api-docs" | head -c 200
