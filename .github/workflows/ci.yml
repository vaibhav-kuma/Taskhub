name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (unit + integration)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify (compile, unit, integration, JaCoCo)
        run: mvn -B --no-transfer-progress verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports
            backend/target/failsafe-reports
            backend/target/site/jacoco
          retention-days: 7

      - name: Upload executable jar
        uses: actions/upload-artifact@v4
        with:
          name: taskhub-api-jar
          path: backend/target/taskhub-api.jar
          retention-days: 7

  desktop:
    name: Desktop client (compile + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Tests (API client + FXML contract)
        run: mvn -B --no-transfer-progress verify

      - name: Package fat jar
        run: mvn -B --no-transfer-progress -DskipTests package

      - name: Upload desktop jar
        uses: actions/upload-artifact@v4
        with:
          name: taskhub-desktop-jar
          path: desktop/target/taskhub-desktop.jar
          retention-days: 7

  ui-smoke:
    name: JavaFX UI smoke (Xvfb)
    runs-on: ubuntu-latest
    needs: [backend, desktop]
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Start API against PostgreSQL service
        working-directory: .
        run: |
          docker run -d --name pg -e POSTGRES_DB=taskhub -e POSTGRES_USER=taskhub \
            -e POSTGRES_PASSWORD=taskhub -p 5432:5432 postgres:16-alpine
          for i in $(seq 1 30); do
            docker exec pg pg_isready -U taskhub -d taskhub && break || sleep 2
          done
          java -jar backend/target/taskhub-api.jar --spring.profiles.active=dev \
            --spring.datasource.url=jdbc:postgresql://localhost:5432/taskhub > /tmp/api.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/actuator/health && break || sleep 2
          done

      - name: Install display + fonts
        run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0 libxtst6

      - name: Run UI smoke test
        env:
          TASKHUB_UI_TEST: '1'
        run: xvfb-run -a --server-args="-screen 0 1440x900x24" mvn -B test -Dtest=UiSmokeTest

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: desktop/target/ui-screenshots
          retention-days: 7

  docker:
    name: Container images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f backend/Dockerfile -t taskhub-api:ci .

      - name: Build web image
        run: docker build -t taskhub-web:ci ./web

      - name: Validate compose file
        run: |
          cp .env.example .env
          sed -i "s|^TASKHUB_JWT_SECRET=.*|TASKHUB_JWT_SECRET=$(openssl rand -base64 48)|" .env
          docker compose config > /dev/null

  web:
    name: Web client static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: JavaScript syntax
        run: node --check web/app.js
      - name: Ensure no inline scripts (CSP safety)
        run: |
          if grep -q "<script>" web/index.html; then
            echo "Inline <script> blocks violate the CSP (script-src 'self')"; exit 1
          fi
          echo "OK"
