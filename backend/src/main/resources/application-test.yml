# Integration-test profile: in-memory H2 in PostgreSQL compatibility mode.
# Flyway runs the *same* migration SQL as production, so schema drift breaks the build.
# ddl-auto=none because H2 and PostgreSQL report JDBC types slightly differently — the
# mappings are exercised end-to-end by the API tests instead of validated structurally.
spring:
  datasource:
    url: jdbc:h2:mem:taskhub;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: false

taskhub:
  jwt:
    secret: ${TASKHUB_JWT_SECRET:+w874FpGRyyP5kWtvgKWw0WDFeLG8cI8a1Mu9BHtEJY+5f3BG8z/Q3dfjze5siaL}
    issuer: taskhub-api
    audience: taskhub-client
    access-token-ttl: PT15M
    refresh-token-ttl: P7D
  cors:
    allowed-origins:
      - http://localhost:8081
  # Disabled here so unrelated tests never trip the limiter; RateLimitIT overrides it.
  rate-limit:
    enabled: false
    auth-attempts: 3
    auth-window: PT5M
  pagination:
    default-size: 20
    max-size: 100

logging:
  level:
    root: WARN
    com.taskhub: INFO
