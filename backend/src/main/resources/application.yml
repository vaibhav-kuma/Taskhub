spring:
  application:
    name: taskhub-api

  datasource:
    # Either provide a full JDBC URL, or the discrete parts (host/port/name).
    url: ${TASKHUB_DB_URL:jdbc:postgresql://${PGHOST:${TASKHUB_DB_HOST:localhost}}:${PGPORT:${TASKHUB_DB_PORT:5432}}/${PGDATABASE:${TASKHUB_DB_NAME:taskhub}}}
    username: ${TASKHUB_DB_USER:${PGUSER:taskhub}}
    password: ${TASKHUB_DB_PASSWORD:${PGPASSWORD:taskhub}}
    hikari:
      pool-name: taskhub-pool
      maximum-pool-size: ${TASKHUB_DB_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 5000
      idle-timeout: 300000
      max-lifetime: 1200000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    baseline-on-migrate: false

  jackson:
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false
    deserialization:
      fail-on-unknown-properties: false

  mvc:
    problemdetails:
      enabled: false

server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  compression:
    enabled: true
    mime-types: application/json,text/html,text/plain
  error:
    include-message: never
    include-stacktrace: never
    whitelabel:
      enabled: false
  tomcat:
    max-swallow-size: 2MB
    threads:
      max: 200

taskhub:
  jwt:
    secret: ${TASKHUB_JWT_SECRET:${JWT_SECRET:}}
    issuer: ${TASKHUB_JWT_ISSUER:taskhub-api}
    audience: ${TASKHUB_JWT_AUDIENCE:taskhub-client}
    access-token-ttl: ${TASKHUB_ACCESS_TOKEN_TTL:PT15M}
    refresh-token-ttl: ${TASKHUB_REFRESH_TOKEN_TTL:P7D}
  cors:
    allowed-origins: ${TASKHUB_CORS_ORIGINS:http://localhost:5173,http://localhost:8081}
  rate-limit:
    enabled: ${TASKHUB_RATE_LIMIT_ENABLED:true}
    auth-attempts: ${TASKHUB_RATE_LIMIT_ATTEMPTS:10}
    auth-window: ${TASKHUB_RATE_LIMIT_WINDOW:PT5M}
  pagination:
    default-size: 20
    max-size: 100
  # Public self-service signup. Set TASKHUB_REGISTRATION_ENABLED=false to close it again.
  registration:
    enabled: ${TASKHUB_REGISTRATION_ENABLED:true}
  # One-time production bootstrap: creates an ADMIN only if no admin exists yet.
  # Leave blank after the first deploy (or remove the variables).
  bootstrap:
    admin-email: ${TASKHUB_BOOTSTRAP_ADMIN_EMAIL:}
    admin-password: ${TASKHUB_BOOTSTRAP_ADMIN_PASSWORD:}
    admin-name: ${TASKHUB_BOOTSTRAP_ADMIN_NAME:Administrator}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: ${TASKHUB_HEALTH_DETAILS:when_authorized}
  info:
    env:
      enabled: true
    java:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: ${TASKHUB_OPENAPI_ENABLED:true}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${TASKHUB_OPENAPI_ENABLED:true}
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
  paths-to-match: /api/**
  default-produces-media-type: application/json

logging:
  level:
    root: INFO
    com.taskhub: ${TASKHUB_LOG_LEVEL:INFO}
    org.hibernate.SQL: WARN
    org.springframework.web: WARN
